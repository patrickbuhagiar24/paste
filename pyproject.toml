[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paste-teks"
version = "1.5.3"
description = "GUI paste teks hierarki dari berkas .txt — tempel ke aplikasi lain satu klik (Ubuntu 26.10)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Patrick Buhagiar" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
paste-teks = "paste_teks.app:main"

[tool.setuptools.packages.find]
include = ["paste_teks*"]
