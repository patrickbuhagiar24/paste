<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pastex launcher preview</title>
    <style>
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
      section { padding: 28px 32px; position: relative; }
      h2 { margin: 0 0 4px; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
      p { margin: 0 0 18px; opacity: .75; font-size: 13px; }
      .light { background: #ffffff; color: #1f2933; }
      .dark { background: #11151c; color: #e6edf3; }
      .busy { background: linear-gradient(120deg, #f7d774 0%, #8fd3ff 45%, #c9b6ff 100%); color: #14202e; }
      .field {
        display: inline-block; width: 320px; padding: 10px 12px; border-radius: 8px;
        border: 1px solid #9fb0c3; background: #fff; color: #101828; font: inherit;
      }
      .dark .field { border-color: #3b4a5c; background: #1b222c; color: #e6edf3; }
      .busy .field { border-color: #6d7f95; background: rgba(255,255,255,.85); }

      /* The style below mirrors the launcher in extension/content.js. */
      .pastex-float {
        position: fixed; z-index: 2147483647; width: 32px; height: 32px; border-radius: 50%;
        border: 2px solid #101a3d; background: linear-gradient(180deg, #3b5bdb 0%, #1c3585 100%);
        color: #fff; font-size: 17px; line-height: 1; cursor: pointer; padding: 0;
        font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
        box-shadow: 0 0 0 2px #fff, 0 0 0 4px #101a3d, 0 0 18px 4px rgba(59, 91, 219, .62),
          0 3px 10px rgba(0, 0, 0, .4);
        transition: transform .12s ease, background .12s ease;
      }
      .pastex-float:hover {
        background: linear-gradient(180deg, #4c6ef5 0%, #24409a 100%);
        transform: scale(1.08);
      }
      .pastex-float:active { transform: scale(.94); }
      .pastex-float:focus-visible { outline: 3px solid #facc15; outline-offset: 3px; }
      .pastex-float::after {
        content: ''; position: absolute; inset: -2px; border-radius: 50%;
        border: 2px solid rgba(59, 91, 219, .85); pointer-events: none;
        animation: pastex-halo 2.4s ease-out infinite;
      }
      @keyframes pastex-halo {
        0% { transform: scale(1); opacity: .85; }
        70% { transform: scale(2); opacity: 0; }
        100% { transform: scale(2); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { .pastex-float::after { animation: none; opacity: 0; } }
      @media (prefers-contrast: more) {
        .pastex-float { border-width: 3px; box-shadow: 0 0 0 3px #fff, 0 0 0 6px #000, 0 0 22px 6px rgba(59, 91, 219, .82); }
      }
    </style>
  </head>
  <body>
    <section class="light">
      <h2>Light page</h2>
      <p>The white ring and the dark rim keep the launcher readable on a white background.</p>
      <input class="field" value="Focus this field" />
    </section>
    <section class="dark">
      <h2>Dark page</h2>
      <p>On a dark page the indigo disc and the glow do the work.</p>
      <input class="field" value="Focus this field" />
    </section>
    <section class="busy">
      <h2>Colourful page</h2>
      <p>The halo pulses gently so the launcher is never mistaken for page decoration.</p>
      <input class="field" value="Focus this field" />
    </section>
    <script>
      // The launcher sits over the bottom right corner of the focused field.
      var field = document.querySelector(".field");
      var launcher = document.createElement("button");
      launcher.className = "pastex-float";
      launcher.textContent = "⚡";
      launcher.title = "Open Pastex side panel";
      document.body.appendChild(launcher);
      function place() {
        var rect = field.getBoundingClientRect();
        launcher.style.left = Math.min(window.innerWidth - 40, Math.max(4, rect.right - 36)) + "px";
        launcher.style.top = Math.min(window.innerHeight - 40, Math.max(4, rect.bottom - 40)) + "px";
      }
      field.addEventListener("focus", place);
      field.addEventListener("input", place);
      place();
    </script>
  </body>
</html>
