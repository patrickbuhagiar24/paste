name: Build .deb & APT repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Suite name of the published archive (Linux Mint; see apt-repo/README.md).
  APT_SUITE: mint

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg gpgv python3-tk python3-pytest xvfb xauth x11-utils

      - name: Run tests
        env:
          PASTE_REQUIRE_X11_TEST: "1"
        run: |
          set -o pipefail
          if ! python3 -m pytest tests/ -q 2>&1 | tee pytest.log; then
            # Surface the failing tests as an annotation so the reason is
            # visible from `gh run view`, not only in the raw log.
            failures=$(grep -E '^(FAILED|ERROR)' pytest.log | head -n 5 | tr '\n' '|' | cut -c1-900)
            printf '::error::pytest failed: %s\n' "${failures:-see the Run tests log}"
            exit 1
          fi

      - name: Upload the pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore

      - name: Build the Debian package
        run: ./scripts/build-deb.sh

      - name: Build the APT archive (pool + dists + Release)
        env:
          PASSTEX_SIGNED: ${{ secrets.GPG_PRIVATE_KEY != '' && '1' || '0' }}
        run: ./scripts/build-apt-repository.sh dist site "$APT_SUITE"

      - name: Sign and verify the archive
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GNUPGHOME: ${{ runner.temp }}/pastex-apt-gnupg
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY is not configured; publishing an unsigned APT archive."
            echo "Users must install pastex-unsigned.sources (Trusted: yes) until the secret is added."
            rm -f site/pastex.sources
            exit 0
          fi
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # In colon output, field 5 is the key ID; the following fpr record holds the full fingerprint.
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '
            $1 == "sec" { primaries++; want_fpr = 1; next }
            want_fpr && $1 == "fpr" { print $10; want_fpr = 0 }
            END { if (primaries != 1) exit 2 }
          ') || { echo 'GPG_PRIVATE_KEY must contain exactly one primary key identity.'; exit 1; }
          [[ "$fingerprint" =~ ^[A-Fa-f0-9]{40}$ ]] || { echo 'Could not determine a valid GPG fingerprint.'; exit 1; }
          gpg --batch --with-colons --list-secret-keys "$fingerprint" \
            | awk -F: '($1 == "sec" || $1 == "ssb") && tolower($12) ~ /s/ { found = 1 } END { exit !found }' \
            || { echo 'The imported GPG key has no secret signing capability.'; exit 1; }
          # sign-apt-repository.sh reads the fingerprint from the environment.
          export APT_SIGNING_KEY_ID="$fingerprint"
          signing_log=$(mktemp)
          if ! ./scripts/sign-apt-repository.sh site "$APT_SUITE" >"$signing_log" 2>&1; then
            cat "$signing_log"
            detail=$(grep -v '^[[:space:]]*$' "$signing_log" | tail -n 6 | tr '\n' '|' | cut -c1-900)
            printf '::error::APT signing failed: %s\n' "$detail"
            exit 1
          fi
          cat "$signing_log"

      - name: Remove the temporary GPG keyring
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/pastex-apt-gnupg
        run: |
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          include-hidden-files: true

      - name: Upload the Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pastex-deb
          path: dist/*.deb

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
