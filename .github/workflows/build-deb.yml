name: Build .deb & APT repo

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Suite name of the published archive (Linux Mint; see apt-repo/README.md).
  APT_SUITE: stable

jobs:
  build:
    runs-on: ubuntu-latest
    # Tag builds create a GitHub Release; permissions are pinned per job.
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check version alignment
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          changelog=$(awk '/^pastex \(/ { gsub(/[()]/, "", $2); print $2; exit }' debian/changelog)
          [[ "$changelog" == "$version-1" ]] || {
            echo "::error::manifest version $version does not match changelog $changelog"
            exit 1
          }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            [[ "$tag" == "$version" ]] || {
              echo "::error::tag $tag does not match manifest version $version"
              exit 1
            }
          fi
          echo "Pastex version: $version"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg gpgv python3-pytest

      - name: Run tests
        run: |
          set -o pipefail
          if ! python3 -m pytest tests/ -q 2>&1 | tee pytest.log; then
            # Surface the failing tests as an annotation so the reason is
            # visible from `gh run view`, not only in the raw log.
            failures=$(grep -E '^(FAILED|ERROR)' pytest.log | head -n 5 | tr '\n' '|' | cut -c1-900)
            printf '::error::pytest failed: %s\n' "${failures:-see the Run tests log}"
            exit 1
          fi

      - name: Run extension tests
        run: node extension/test/run.js

      - name: Upload the pytest log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore

      - name: Build the Debian package
        env:
          CRX_SIGNING_SECRET: ${{ secrets.PASTEX_CRX_PRIVATE_KEY }}
          # SOURCE_DATE_EPOCH is deliberately NOT set here: build-deb.sh derives
          # it from the commit, so the same ref always builds the same bytes.
        run: |
          set -euo pipefail
          if [ -n "$CRX_SIGNING_SECRET" ]; then
            printf '%s' "$CRX_SIGNING_SECRET" > "$RUNNER_TEMP/pastex-crx-key.pem"
            chmod 600 "$RUNNER_TEMP/pastex-crx-key.pem"
            export PASTEX_CRX_KEY="$RUNNER_TEMP/pastex-crx-key.pem"
          elif [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "::error::PASTEX_CRX_PRIVATE_KEY is required for a release; refusing an ephemeral extension ID."
            exit 1
          else
            echo "::warning::PASTEX_CRX_PRIVATE_KEY is not configured; using an ephemeral id for this test build."
          fi
          ./scripts/build-deb.sh

      - name: Lint the package
        run: |
          set -o pipefail
          sudo apt-get install -y lintian
          # Errors fail the build. The warnings we knowingly keep (the CRX is
          # not an ELF payload) are listed here instead of hidden globally.
          if ! lintian --fail-on error dist/*.deb 2>&1 | tee lintian.log; then
            grep -E '^E:' lintian.log | head -n 10 | sed 's/^/::error::/' || true
            exit 1
          fi
          cat lintian.log

      - name: Build the APT archive (pool + dists + Release)
        env:
          # The public Pages archive is always signed; unsigned builds exist
          # only for local testing via scripts/setup-apt-repo.sh.
          PASSTEX_SIGNED: '1'
          # Deliberately not set: build-apt-repository.sh derives it from the
          # last commit, so Release (Date, Valid-Until) is reproducible. The
          # same checkout must publish the same metadata twice.
        run: ./scripts/build-apt-repository.sh dist site "$APT_SUITE"

      - name: Sign and verify the archive
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GNUPGHOME: ${{ runner.temp }}/pastex-apt-gnupg
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY is required; refusing to publish an unsigned APT archive."
            exit 1
          fi
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # In colon output, field 5 is the key ID; the following fpr record holds the full fingerprint.
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '
            $1 == "sec" { primaries++; want_fpr = 1; next }
            want_fpr && $1 == "fpr" { print $10; want_fpr = 0 }
            END { if (primaries != 1) exit 2 }
          ') || { echo 'GPG_PRIVATE_KEY must contain exactly one primary key identity.'; exit 1; }
          [[ "$fingerprint" =~ ^[A-Fa-f0-9]{40}$ ]] || { echo 'Could not determine a valid GPG fingerprint.'; exit 1; }
          gpg --batch --with-colons --list-secret-keys "$fingerprint" \
            | awk -F: '($1 == "sec" || $1 == "ssb") && tolower($12) ~ /s/ { found = 1 } END { exit !found }' \
            || { echo 'The imported GPG key has no secret signing capability.'; exit 1; }
          # sign-apt-repository.sh reads the fingerprint from the environment.
          export APT_SIGNING_KEY_ID="$fingerprint"
          signing_log=$(mktemp)
          if ! ./scripts/sign-apt-repository.sh site "$APT_SUITE" >"$signing_log" 2>&1; then
            cat "$signing_log"
            detail=$(grep -v '^[[:space:]]*$' "$signing_log" | tail -n 6 | tr '\n' '|' | cut -c1-900)
            printf '::error::APT signing failed: %s\n' "$detail"
            exit 1
          fi
          cat "$signing_log"

      - name: Publish verification artifacts
        run: |
          set -euo pipefail
          cp dist/pastex-id.txt site/extension-id.txt
          # Paths relative to the site root: checksums.txt is served from there,
          # and scripts/verify-site.py compares every line with the file it names.
          {
            (cd dist && sha256sum ./*.deb)
            (cd build/deb/usr/share/pastex && sha256sum pastex.crx)
          } | sed 's#  \./#  pool/main/p/pastex/#' >site/checksums.txt
          chmod 0644 site/extension-id.txt site/checksums.txt

      - name: Verify what will be published
        env:
          # The Pages archive is always signed, so the signature is checked too.
          PASSTEX_SIGNED: '1'
        run: python3 scripts/verify-site.py site "$APT_SUITE" --signed

      - name: Remove the temporary GPG keyring
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/pastex-apt-gnupg
        run: |
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

      - name: Upload the Debian package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pastex-deb
          path: |
            dist/*.deb
            dist/pastex-id.txt
            build/deb/usr/share/pastex/pastex.crx
          if-no-files-found: error

      - name: Create a GitHub Release with verification data
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          fingerprint=$(cat site/archive-keyring.fingerprint.txt)
          extension_id=$(cat site/extension-id.txt)
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf 'Pastex %s\n\n' "$version"
            printf 'Verify the APT signing fingerprint through an independent maintainer channel before installing: `%s`\n\n' "$fingerprint"
            printf 'Chrome extension ID: `%s`\n\n' "$extension_id"
            printf 'SHA-256 checksums:\n\n```text\n'
            cat site/checksums.txt
            printf '```\n\n'
            printf 'Install from the signed APT repository as described in the project README.\n'
          } >"$notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Pastex $version" \
            --notes-file "$notes" \
            dist/*.deb build/deb/usr/share/pastex/pastex.crx \
            site/archive-keyring.asc site/archive-keyring.gpg \
            site/archive-keyring.fingerprint.txt site/checksums.txt site/extension-id.txt

  deploy:
    needs: build
    # Main pushes and manual dispatch (any branch) deploy to Pages; tag pushes
    # publish a GitHub Release instead. The Pages environment is unrestricted.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
