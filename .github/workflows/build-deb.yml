name: Build .deb & APT repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils python3-tk python3-pytest xvfb xauth x11-utils

      - name: Run tests
        env:
          PASTE_REQUIRE_X11_TEST: "1"
        run: |
          python3 -m pytest tests/ -q

      - name: Build the Debian package
        run: ./scripts/build-deb.sh

      - name: Build APT repository (Packages and Release)
        run: |
          mkdir -p apt-repo/dist
          cp dist/*.deb apt-repo/dist/
          cd apt-repo/dist
          dpkg-scanpackages --arch all . > Packages
          gzip -9 -k -f Packages
          cat > apt-ftparchive.conf <<'EOF'
          APT::FTPArchive::Release::Origin "Pastex";
          APT::FTPArchive::Release::Label "Pastex";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "all";
          APT::FTPArchive::Release::Components "main";
          APT::FTPArchive::Release::Description "Pastex APT repository for Ubuntu 26.10";
          EOF
          apt-ftparchive -c apt-ftparchive.conf release . > Release
          ls -la

      - name: Sign the Release with GPG (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY secret is missing — Release will not be signed."
            echo "The repository can still be used with [trusted=yes]; see apt-repo/README.md for signing instructions."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign -o apt-repo/dist/Release.gpg apt-repo/dist/Release
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --clearsign -o apt-repo/dist/InRelease apt-repo/dist/Release
          gpg --batch --armor --export > apt-repo/dist/pastex.gpg
          ls -la apt-repo/dist/

      - name: Create a simple index.html
        run: |
          {
            echo "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Repo APT Pastex</title></head><body>"
            echo "<h1>Repo APT Pastex</h1><ul>"
            for f in apt-repo/dist/*; do echo "<li><a href='$(basename "$f")'>$(basename "$f")</a></li>"; done
            echo "</ul></body></html>"
          } > apt-repo/dist/index.html

      - name: Publish to GitHub Pages (gh-pages branch, apt/ folder)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git checkout -B gh-pages origin/gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true
          mkdir -p apt
          cp -r "$GITHUB_WORKSPACE/apt-repo/dist/"* apt/
          git add apt/
          git commit -m "APT repo: pastex $(date -u +%Y-%m-%d)" || true
          git push origin gh-pages

      - name: Upload the Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pastex-deb
          path: dist/*.deb
