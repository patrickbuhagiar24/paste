name: Build .deb & APT repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pasang dependensi build
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Uji
        run: |
          python3 -m pip install pytest -q
          python3 -m pytest tests/ -q

      - name: Bangun .deb
        run: ./scripts/build-deb.sh

      - name: Bangun repo APT (Packages + Release)
        run: |
          mkdir -p apt-repo/dist
          cp dist/*.deb apt-repo/dist/
          cd apt-repo/dist
          dpkg-scanpackages --arch all . > Packages
          gzip -9 -k -f Packages
          cat > apt-ftparchive.conf <<'EOF'
          APT::FTPArchive::Release::Origin "Paste Teks";
          APT::FTPArchive::Release::Label "Paste Teks";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "all";
          APT::FTPArchive::Release::Components "main";
          APT::FTPArchive::Release::Description "Repo APT Paste Teks untuk Ubuntu 26.10";
          EOF
          apt-ftparchive -c apt-ftparchive.conf release . > Release
          ls -la

      - name: Tandatangani Release dengan GPG (opsional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "Secret GPG_PRIVATE_KEY tidak ada — Release tidak ditandatangani."
            echo "Repo tetap bisa dipakai dengan [trusted=yes]; lihat apt-repo/README.md untuk tanda tangan."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign -o apt-repo/dist/Release.gpg apt-repo/dist/Release
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --clearsign -o apt-repo/dist/InRelease apt-repo/dist/Release
          gpg --batch --armor --export > apt-repo/dist/paste-teks.gpg
          ls -la apt-repo/dist/

      - name: Buat index.html sederhana
        run: |
          {
            echo "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Repo APT Paste Teks</title></head><body>"
            echo "<h1>Repo APT Paste Teks</h1><ul>"
            for f in apt-repo/dist/*; do echo "<li><a href='$(basename "$f")'>$(basename "$f")</a></li>"; done
            echo "</ul></body></html>"
          } > apt-repo/dist/index.html

      - name: Terbitkan ke GitHub Pages (branch gh-pages, folder apt/)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git checkout -B gh-pages origin/gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true
          mkdir -p apt
          cp -r "$GITHUB_WORKSPACE/apt-repo/dist/"* apt/
          git add apt/
          git commit -m "APT repo: paste-teks $(date -u +%Y-%m-%d)" || true
          git push origin gh-pages

      - name: Unggah .deb sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: paste-teks-deb
          path: dist/*.deb
