<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pastex</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <input id="search" type="search" placeholder="Search snippets…" aria-label="Search snippets" />
      <div class="toolbar" role="toolbar" aria-label="Snippet actions">
        <button id="btn-collapse-all" title="Collapse all folders" disabled>▸ Collapse all</button>
        <button id="btn-select" aria-pressed="false" title="Select items to move or delete">Select</button>
        <button id="btn-sync" title="Reload from Google Drive">↻ Refresh</button>
        <button id="btn-config" title="Import configuration files">Config</button>
        <button id="btn-text" class="primary" title="New snippet">＋ Text</button>
        <button id="btn-folder" class="primary" title="New folder">＋ Folder</button>
      </div>
      <div id="drive-bar">
        <span id="drive-status" aria-live="polite">Drive: not connected.</span>
        <span id="last-checked" title="When the library was last checked in Google Drive">Checked: never</span>
        <span id="status" aria-live="polite"></span>
      </div>
    </header>
    <main>
      <div id="tree" role="tree" aria-label="Snippets"></div>
      <div id="empty" hidden>
        <div class="empty-icon">📁</div>
        <p>Connect to Google Drive to show your snippets.</p>
        <button id="btn-empty-text" class="primary">＋ New snippet</button>
      </div>
    </main>
    <div id="editor-overlay" hidden>
      <div id="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title">
        <h2 id="editor-title">New snippet</h2>
        <label id="editor-parent-label" for="editor-parent">Folder</label>
        <select id="editor-parent"></select>
        <label for="editor-name">Name</label>
        <input id="editor-name" type="text" />
        <div id="editor-text-wrap">
          <label for="editor-text">Text</label>
          <textarea id="editor-text" rows="10"></textarea>
        </div>
        <div class="editor-buttons">
          <button id="editor-save" class="primary">Save</button>
          <button id="editor-cancel">Cancel</button>
        </div>
      </div>
    </div>
    <div id="selection-actions" role="toolbar" aria-label="Selected item actions" hidden>
      <span id="selection-count">0 selected</span>
      <button id="btn-up" disabled>↑ Up</button>
      <button id="btn-down" disabled>↓ Down</button>
      <button id="btn-delete-selected" class="danger" disabled>🗑 Delete</button>
    </div>
    <script src="store.js"></script>
    <script src="sites.js"></script>
    <script src="config-import.js"></script>
    <script src="config-manifest.js"></script>
    <script src="handle-store.js"></script>
    <script src="config-source.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
