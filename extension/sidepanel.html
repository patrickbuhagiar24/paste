<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pastex</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <input id="search" type="search" placeholder="Search snippets…" aria-label="Search snippets" />
      <div class="toolbar" role="toolbar" aria-label="Snippet actions">
        <button id="btn-collapse-all" class="icon" title="Collapse all folders" aria-label="Collapse all folders" disabled>⤡</button>
        <button id="btn-select" class="icon" aria-pressed="false"
                title="Select items" aria-label="Select items">☑</button>
        <button id="btn-sync" class="icon" title="Sync changes to Drive"
                aria-label="Sync changes to Drive">↻</button>
        <button id="btn-config" class="icon" title="Choose config file"
                aria-label="Choose config file">⚙</button>
        <button id="btn-text" class="icon primary" title="New snippet" aria-label="New snippet">📝</button>
        <button id="btn-folder" class="icon primary" title="New folder" aria-label="New folder">📁</button>
        <!-- Newline on insert: the toggle decides what a click on a row appends;
             the row button keeps its own, one-time meaning. Icon only, so the
             state is read from the pressed style and the title. -->
        <button id="btn-newline" class="icon" aria-pressed="false"
                title="Final newline on — click to remove it" aria-label="No final newline">←</button>
      </div>
      <!-- One status line. The connection state and the age of the last check
           are not shown separately: a failure has to be readable, and two more
           truncated labels next to it only pushed the message out of view. -->
      <div id="status-bar">
        <span id="status" aria-live="polite"></span>
        <button id="btn-review-conflict" class="icon" title="Review pending edit" aria-label="Review pending edit">⚠</button>
        <button id="btn-copy-pending" class="icon" title="Copy pending changes" aria-label="Copy pending changes">⧉</button>
      </div>
    </header>
    <main>
      <div id="tree" role="tree" aria-label="Snippets"></div>
      <!-- The empty state is empty on purpose: the status line above already
           says what happened, and a second sentence inside the list would be a
           second place to read the same thing. -->
      <div id="empty" hidden></div>
    </main>
    <div id="editor-overlay" hidden>
      <div id="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title">
        <h2 id="editor-title">New snippet</h2>
        <label id="editor-parent-label" for="editor-parent">Folder</label>
        <select id="editor-parent"></select>
        <label id="editor-name-label" for="editor-name">Name</label>
        <input id="editor-name" type="text" />
        <div id="editor-text-wrap">
          <label for="editor-text">Text</label>
          <textarea id="editor-text" rows="10"></textarea>
        </div>
        <div class="editor-buttons">
          <button id="editor-save" class="icon primary" title="Save" aria-label="Save">✓</button>
          <button id="editor-cancel" class="icon" title="Cancel" aria-label="Cancel">✕</button>
        </div>
      </div>
    </div>
    <div id="conflict-overlay" hidden>
      <div id="conflict-dialog" role="dialog" aria-modal="true" aria-labelledby="conflict-title">
        <h2 id="conflict-title">Review pending edit</h2>
        <p id="conflict-name"></p>
        <p id="conflict-status" aria-live="polite"></p>
        <p>Compare the versions. Drive can still change before sync.</p>
        <label for="conflict-base">Original</label>
        <textarea id="conflict-base" readonly rows="4"></textarea>
        <label for="conflict-local">Pending edit</label>
        <textarea id="conflict-local" readonly rows="4"></textarea>
        <label for="conflict-remote">Current Drive text</label>
        <textarea id="conflict-remote" readonly rows="4"></textarea>
        <div class="editor-buttons">
          <button id="conflict-copy-drive" class="icon" title="Copy Drive text" aria-label="Copy Drive text">⧉</button>
          <button id="conflict-keep-drive" class="icon" title="Use Drive text" aria-label="Use Drive text">↓</button>
          <button id="conflict-keep-local" class="icon primary" title="Keep pending edit for sync" aria-label="Keep pending edit for sync">✓</button>
          <button id="conflict-close" class="icon" title="Close review" aria-label="Close review">✕</button>
        </div>
      </div>
    </div>
    <div id="row-menu" role="menu" aria-label="Edit row" hidden></div>
    <div id="selection-actions" role="toolbar" aria-label="Selected item actions" hidden>
      <span id="selection-count" aria-label="number selected">0</span>
      <button id="btn-up" class="icon" disabled title="Move up" aria-label="Move up">↑</button>
      <button id="btn-down" class="icon" disabled title="Move down" aria-label="Move down">↓</button>
      <button id="btn-move-selected" class="icon" disabled title="Move to folder…"
              aria-label="Move selected items">↪</button>
      <button id="btn-delete-selected" class="icon danger" disabled title="Delete selected"
              aria-label="Delete selected items">🗑</button>
    </div>
    <script src="store.js"></script>
    <script src="sites.js"></script>
    <script src="config-source.js"></script>
    <script src="panel-command.js"></script>
    <script src="conflict-panel.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
